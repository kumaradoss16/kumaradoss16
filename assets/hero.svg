<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Kumaradoss S — Python Developer</title>
  <desc id="heroDesc">Midnight editorial banner introducing Kumaradoss S, a Python developer focused on backend systems, developer tools, and applied AI.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1620"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#17212D" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="340" fill="url(#surface)"/>
  <rect width="1000" height="340" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="5" height="340" fill="#F37726"/>

  <g stroke="#263342" stroke-width="1" opacity="0.9">
    <path d="M596 34h12M602 28v12"/>
    <path d="M596 306h12M602 300v12"/>
  </g>

