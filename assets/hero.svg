    <text x="63" y="160" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#F1F5F9">Kumaradoss S</text>

    <text x="64" y="201" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#B8C3D1">Backend systems, developer tools, and applied AI.</text>

    <path d="M64 234h72" stroke="#F37726" stroke-width="3"/>

    <text x="64" y="272" font-size="12" letter-spacing="2" fill="#8291A3">ASSOCIATE CORPORATE IT TRAINER · FOUNDER @ DEVSPIREHUB</text>
